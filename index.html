<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunsin Creativa - Tes Header & Footer</title>

    <!-- ⭐ Anti-flash: terapkan tema sebelum render -->
    <script>
        (function() {
            const saved = localStorage.getItem('gunsin-theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (systemDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
    <!-- ⭐ HEADER akan di-inject ke sini -->
    <header id="site-header"></header>

    <main style="min-height: 60vh; padding: 4rem 0;">
        <div class="container" style="text-align: center;">
            <h1 style="color: var(--accent-secondary); margin-bottom: 1rem;">
                Tes Header & Footer
            </h1>
            <p style="color: var(--text-secondary); margin-bottom: 2rem;">
                Jika Anda melihat header di atas dengan logo, menu, dan tombol tema — 
                berarti sistem injection bekerja dengan baik.
            </p>
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                Coba klik tombol menu di kanan atas (di layar kecil) untuk menguji menu mobile.
            </p>
        </div>
    </main>

    <!-- ⭐ FOOTER akan di-inject ke sini -->
    <footer id="site-footer"></footer>

    <!-- Urutan script PENTING: site-config dulu, baru komponen -->
    <script src="data/site-config.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
