<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tidak Ditemukan - Gunsin Creativa</title>
    <meta name="robots" content="noindex">

    <script>
        (function() {
            const saved = localStorage.getItem('gunsin-theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (systemDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" href="assets/img/brand/favicon.ico" sizes="any">
    <meta name="theme-color" content="#7c3aed">

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
    <header id="site-header"></header>

    <main>
        <section class="section" style="min-height: 60vh; display: flex; align-items: center;">
            <div class="container" style="text-align: center; max-width: 600px;">
                <div style="
                    font-family: var(--font-display);
                    font-size: clamp(5rem, 20vw, 10rem);
                    font-weight: 800;
                    line-height: 1;
                    background: var(--gradient-brand);
                    -webkit-background-clip: text;
                    background-clip: text;
                    -webkit-text-fill-color: transparent;
                    margin-bottom: var(--space-md);
                ">404</div>

                <h1 class="section-title" style="margin-bottom: var(--space-md);">
                    Halaman Tidak Ditemukan
                </h1>

                <p class="section-subtitle" style="margin-bottom: var(--space-xl);">
                    Sepertinya halaman yang Anda cari sudah dipindahkan, dihapus, atau tidak pernah ada.
                </p>

                <div class="hero-cta" style="justify-content: center;">
                    <a href="index.html" class="btn btn-primary btn-lg">
                        ← Kembali ke Beranda
                    </a>
                    <a href="kontak.html" class="btn btn-outline btn-lg">
                        Hubungi Kami
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="data/site-config.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
